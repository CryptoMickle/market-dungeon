name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      JUDGE_REPLAY_SEAL_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:shannon
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build -- --webpack
      - run: npm run test:e2e:iphone
        env:
          PLAYWRIGHT_PRODUCTION: '1'
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_PRODUCTION: '1'
      - name: Keep baseline browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: baseline-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  agents-ui:
    runs-on: ubuntu-latest
    env:
      JUDGE_REPLAY_SEAL_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      MARKET_DUNGEON_LOCAL_AGENTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build and verify Agents, neutral Home, wallet loading and reload safety
        run: npm run release:verify:agents
      - name: Keep Agents browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agents-browser-failures
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
