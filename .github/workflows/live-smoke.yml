name: Live Judge Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Exact Market Dungeon Vercel origin to test (Preview or Production)
        required: true
        default: https://market-dungeon.vercel.app
        type: string
  schedule:
    - cron: '17 6 * * 1,4'

permissions:
  contents: read

jobs:
  judge-demo-production:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIVE_SMOKE_BASE_URL: ${{ inputs.base_url || 'https://market-dungeon.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Validate live target and frozen commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: node --experimental-strip-types scripts/validate-live-target.ts
      - run: npx playwright install --with-deps chromium
      - name: Scheduled single-run canary
        if: github.event_name == 'schedule'
        run: npm run test:smoke:live
      - name: Manual 20-run zero-retry release gate
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:smoke:live -- --repeat-each=20 --workers=1 --retries=0
